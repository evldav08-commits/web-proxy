services:
  - type: web
    name: my-web-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MAX_RESPONSE_BYTES
        value: "8388608"
      - key: REQUEST_TIMEOUT_MS
        value: "15000"
